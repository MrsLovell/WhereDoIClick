 if(phishing&&view.selected==='Dawn message')view.selected='Suspicious message';
 available.forEach(a=>{const btn=b(a[0],a[1]+' · '+a[2],'msg'+(view.selected===a[0]?' active':''));msgs.append(btn)});layout.append(msgs);
 const read=div('reading');

 else{
 const suspicious=phishing&&view.selected==='Suspicious message';

 const message=div('');message.style.marginTop='20px';
 if(suspicious){message.innerHTML='<p>Hello,</p><p><strong>URGENT:</strong> Your work email will be locked today unless you verify your password.</p><p>Click the link below and enter your work username and password right away.</p><p><a href="#" class="fake-phish-link">Verify your account now</a></p><p>Do not tell your supervisor. This request is confidential.</p><p>Thank you,<br>IT Help Desk</p>';}
 else if(kaitlyn){message.innerHTML='Hi Team,<p>Please remember to check your tasks before leaving today.</p>Thanks,<br>Kaitlyn';}
 else if(team){message.innerHTML='Hi Everyone,<p>Thank you for your work this week!</p>Have a good weekend,<br>Team';}
 else{message.innerHTML='Hi Team,<p>Please review the attached rotation schedule before tomorrow.</p>Thanks,<br>Dawn';}

 if(!suspicious&&!kaitlyn&&!team)read.append(b('Rotation Schedule.pdf','📄 Rotation Schedule.pdf'));
 if(suspicious){const link=message.querySelector('.fake-phish-link');link.addEventListener('click',e=>{e.preventDefault();lastClicked={label:'Suspicious link',text:'Verify your account now'};click('Suspicious link')});}
 }

}
function renderApp(){if(run[index].app==='edge')renderEdge();else renderOutlook()}
function updateStats(){$('score').textContent=`${stats[0]} independent · ${stats[1]} self-corrected · ${stats[2]} with help`}
function showSuccess(k){$('successSubtitle').textContent=['You found it on your own!','You figured it out after trying again!','You found it using help!'][k];$('successNext').textContent=index===run.length-1?'See Results →':'Next Question →';$('successShade').classList.remove('hidden');$('successNext').focus()}
function hideSuccess(){$('successShade').classList.add('hidden')}
$('successReview').onclick=hideSuccess;
$('successNext').onclick=()=>{hideSuccess();$('next').click()};
function render(){hideSuccess();stage=0;wrong=0;helpCount=0;done=false;view={folder:'Inbox',selected:run[index].steps.includes('Report phishing')?'Suspicious message':'Dawn message'};lastClicked=null;$('progress').textContent=`Question ${index+1} of ${run.length} · ${run[index].app==='edge'?'Microsoft Edge':'Outlook'}`;$('task').textContent=run[index].task;const stepInfo=$('stepinfo');stepInfo.textContent=run[index].steps.length>1?'This task has '+run[index].steps.length+' steps. Do one step at a time.':'';$('feedback').textContent='';$('hint').classList.add('hidden');$('next').classList.add('hidden');$('help').disabled=false;$('help').textContent='I Need Help';renderApp();updateStats()}
$('help').onclick=()=>{if(done)return;helpCount=Math.min(3,helpCount+1);let q=run[index];let hint=q.hints[helpCount-1];if(stage>0){const next=q.steps[stage];hint=helpCount===1?'You finished the first step. Look at what is open on the screen now.':helpCount===2?'Look inside the open '+(q.app==='edge'?'panel or menu.':'message window.'):'Find the option labeled '+next+'.'}$('hint').textContent=`Help ${helpCount} of 3: ${hint}`;$('hint').classList.remove('hidden');$('help').textContent=helpCount<3?'I Need More Help':'All Hints Shown';$('help').disabled=helpCount>=3};
$('next').onclick=()=>{index++;$('help').textContent='I Need Help';if(index<run.length)render();else finish()};$('restart').onclick=()=>{if(confirm('Start a new set of 15 questions? Your current game will end.'))start()};
function finish(){$('app').classList.add('hidden');$('help').classList.add('hidden');$('next').classList.add('hidden');$('task').textContent='Your Technology Skills Results';$('progress').textContent='15 questions completed';$('feedback').textContent='';let box=$('results');box.classList.remove('hidden');box.replaceChildren();let h=document.createElement('h2');h.textContent=`Independent: ${stats[0]} · Self-corrected: ${stats[1]} · With help: ${stats[2]}`;box.append(h);history.forEach((x,i)=>{let p=document.createElement('p');p.textContent=`${i+1}. ${x.result} (${x.hints} hints, ${x.wrong} incorrect clicks) — ${x.task}`;box.append(p)});let copy=b('Copy Results','Copy Results');copy.onclick=()=>{let t=history.map((x,i)=>`${i+1}. ${x.result} (${x.hints} hints, ${x.wrong} wrong clicks): ${x.task}`).join('\n');navigator.clipboard?.writeText(t).then(()=>copy.textContent='Copied!').catch(()=>copy.textContent='Copy unavailable')};box.append(copy)}
function downloadResults(){
  const name=$('studentName').value.trim()||'Student';
  const completed=history.length;
  const lines=[
    'WHERE DO I CLICK? — PROGRESS REPORT',
    'Student: '+name,
    'Date: '+new Date().toLocaleString(),
    'Questions completed: '+completed+' of '+run.length,
    'Independent: '+stats[0],
    'Self-corrected: '+stats[1],
    'With help: '+stats[2],
    'Not yet completed: '+(run.length-completed),
    '',
    'QUESTION DETAILS'
  ];
  history.forEach((x,i)=>lines.push(
    (i+1)+'. '+x.task+'\n   Result: '+x.result+
    ' | Help hints used: '+x.hints+
    ' | Incorrect clicks: '+x.wrong
  ));
  if(completed<run.length)lines.push('','This is an in-progress report. Unfinished questions are not scored.');
  const blob=new Blob([lines.join('\n')+'\n'],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const safe=name.replace(/[^a-z0-9_-]+/gi,'_').replace(/^_+|_+$/g,'')||'Student';
  a.href=url;
  a.download='Where_Do_I_Click_Results_'+safe+'.txt';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
$('downloadTop').onclick=downloadResults;
$('downloadBottom').onclick=downloadResults;
function start(){sessionId=newSessionId();run=mix([...mix(bank.filter(q=>q.app==='edge')).slice(0,8),...mix(bank.filter(q=>q.app==='outlook')).slice(0,7)]);index=0;stats=[0,0,0];history=[];$('app').classList.remove('hidden');$('results').classList.add('hidden');$('help').classList.remove('hidden');$('help').textContent='I Need Help';render()}
start();
